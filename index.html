<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8FA876">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>风口瞭望 · 行业趋势政策工作台</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#F5F1E8; --bg2:#FAF7F0; --card:#FFFFFF; --card2:#FDFBF6;
  --primary:#8FA876; --primary-d:#6B8E5A; --primary-l:#B7C9A3;
  --accent:#C9A96E; --text:#3D4A36; --text2:#6B7A60; --muted:#9AA890;
  --border:#E3DCCB; --shadow:rgba(122,142,100,.12); --radius:18px;
  --nav-h:62px; --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="mint"]{--bg:#EDF6F0;--bg2:#F4FAF6;--card:#FFFFFF;--card2:#F7FCF9;--primary:#5BA88A;--primary-d:#3D8B6E;--primary-l:#9FD4BD;--accent:#7EC8B8;--text:#244A3D;--text2:#4E7A66;--muted:#8FB8A6;--border:#D5E8DD;--shadow:rgba(60,120,95,.12)}
[data-theme="cream"]{--bg:#FBF6EC;--bg2:#FFFBF2;--card:#FFFFFF;--card2:#FFFDF7;--primary:#C9A96E;--primary-d:#A8884E;--primary-l:#E4D0A6;--accent:#D4B886;--text:#4A3D28;--text2:#7A6850;--muted:#B0A088;--border:#EFE5D2;--shadow:rgba(160,130,80,.12)}
[data-theme="dark"]{--bg:#1A1F1B;--bg2:#232A24;--card:#2A312B;--card2:#313A33;--primary:#9DBF85;--primary-d:#7BA563;--primary-l:#5F7A4E;--accent:#C9A96E;--text:#E0E6DC;--text2:#A8B49E;--muted:#6B7A60;--border:#3A4339;--shadow:rgba(0,0,0,.35)}
[data-theme="berry"]{--bg:#F5EFF2;--bg2:#FBF6F8;--card:#FFFFFF;--card2:#FDF9FB;--primary:#B57B8E;--primary-d:#9A5E72;--primary-l:#D7AEBE;--accent:#C99AAE;--text:#4A2E38;--text2:#7A5260;--muted:#B08E9A;--border:#EADAE0;--shadow:rgba(150,90,110,.12)}

/* 护眼模式叠加 */
.eye-on{filter:sepia(.22) saturate(.85) brightness(.96) contrast(.97) !important}
#eyeOverlay{position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:0;transition:opacity .3s;background:radial-gradient(ellipse at center,rgba(180,210,160,.04),rgba(120,160,90,.07))}
.eye-on #eyeOverlay{opacity:1}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;overflow-x:hidden;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
a{color:var(--primary-d);text-decoration:none}
img{max-width:100%}


/* ============ 骨架屏加载动画 ============ */
.skeleton{background:linear-gradient(90deg,var(--card2) 25%,var(--bg2) 50%,var(--card2) 75%);background-size:200% 100%;animation:skeleton-loading 1.5s infinite;border-radius:12px}
@keyframes skeleton-loading{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{height:140px;margin-bottom:12px;border-radius:var(--radius)}
.skel-title{height:20px;width:60%;margin-bottom:10px;border-radius:8px}
.skel-text{height:14px;width:100%;margin-bottom:8px;border-radius:6px}
.skel-text.short{width:70%}
.loading-wrap{padding:20px 16px}
.loading-tip{text-align:center;color:var(--muted);font-size:13px;padding:20px 0}
/* 最后更新时间 */
.last-update{font-size:11px;color:var(--muted);text-align:right;padding:4px 16px 0}

/* ============ 顶部栏 ============ */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg2);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top-row{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--primary-d);flex-shrink:0}
.logo .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-l));box-shadow:0 0 8px var(--primary)}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;padding:9px 14px 9px 36px;border-radius:24px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--shadow)}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.top-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);transition:all .2s;position:relative}
.icon-btn:active{transform:scale(.92)}
.icon-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.icon-btn svg{width:18px;height:18px}
.badge{position:absolute;top:-2px;right:-2px;background:var(--accent);color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;font-weight:600}

/* ============ 主题/语言切换条 ============ */
.subbar{display:flex;align-items:center;gap:8px;padding:8px 14px 0;overflow-x:auto;scrollbar-width:none}
.subbar::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:12px;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip:active{transform:scale(.94)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip .sw{width:12px;height:12px;border-radius:4px;border:1px solid rgba(0,0,0,.1)}

/* ============ 主内容 ============ */
.main{padding:12px 14px calc(var(--nav-h) + var(--safe-b) + 24px);max-width:720px;margin:0 auto}
.page{display:none;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Hero */
.hero{background:linear-gradient(135deg,var(--primary),var(--primary-d));border-radius:22px;padding:22px 20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::before{content:"";position:absolute;right:30px;bottom:-50px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h2{font-size:21px;margin-bottom:6px;position:relative}
.hero p{font-size:13px;opacity:.92;position:relative}
.hero-stats{display:flex;gap:14px;margin-top:16px;position:relative}
.hero-stat b{font-size:22px;display:block}
.hero-stat span{font-size:11px;opacity:.85}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 2px 12px var(--shadow);transition:transform .15s}
.card:active{transform:scale(.99)}
.card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.tag{flex-shrink:0;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.hot{background:rgba(201,169,110,.18);color:var(--accent)}
.tag.new{background:rgba(143,168,118,.18);color:var(--primary-d)}
.tag.gov{background:rgba(91,140,200,.15);color:#5B8CC8}
.tag.global{background:rgba(155,120,200,.15);color:#9B78C8}
.tag.career{background:rgba(200,120,130,.15);color:#C8788A}
.card h3{font-size:15.5px;color:var(--text);line-height:1.45}
.card p{font-size:13px;color:var(--text2);margin-top:6px}
.card .nums{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.num-pill{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:5px 10px;font-size:11.5px;color:var(--text2)}
.num-pill b{color:var(--primary-d);font-size:13px}
.card-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.link-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;background:var(--primary-l);color:var(--primary-d);font-size:12px;font-weight:600;transition:all .2s}
.link-btn:active{transform:scale(.94)}
.link-btn.alt{background:var(--card2);border:1px solid var(--border);color:var(--text2)}
.link-btn svg{width:13px;height:13px}
.src{font-size:11px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:4px}

/* 区块标题 */
.sec-title{display:flex;align-items:center;gap:8px;margin:18px 0 10px;font-size:16px;font-weight:700;color:var(--text)}
.sec-title .bar{width:4px;height:18px;border-radius:3px;background:linear-gradient(var(--primary),var(--primary-l))}
.sec-title .en{font-size:11px;color:var(--muted);font-weight:400}

/* 转行路径 */
.path-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;border-left:4px solid var(--primary)}
.path-card .step{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border)}
.path-card .step:last-child{border:0}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--primary-l);color:var(--primary-d);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step .st b{font-size:13.5px}.step .st span{font-size:12px;color:var(--text2)}

/* 视频卡片 */
.vid-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.vid-thumb{height:130px;background:linear-gradient(135deg,var(--primary-d),var(--primary-l));position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.vid-thumb::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.12)}
.play-btn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.play-btn svg{width:22px;height:22px;color:var(--primary-d);margin-left:3px}
.vid-info{padding:12px 14px}
.vid-info h4{font-size:14px;margin-bottom:4px}
.vid-info .meta{font-size:11.5px;color:var(--muted);display:flex;gap:10px}

/* 记录 */
.note-input{display:flex;gap:8px;margin-bottom:12px}
.note-input select{padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none}
.note-input input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;outline:none}
.note-input input:focus,.note-input select:focus{border-color:var(--primary)}
.add-btn{padding:10px 16px;border-radius:12px;background:var(--primary);color:#fff;border:0;font-size:13px;font-weight:600;cursor:pointer}
.add-btn:active{transform:scale(.94)}
.note-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.note-item .nt{flex-shrink:0;width:6px;height:6px;border-radius:50%;margin-top:6px}
.note-item .nb{flex:1}
.note-item .nb .nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.note-item .ncat{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--text2)}
.note-item .ntext{font-size:13px;color:var(--text);word-break:break-word}
.note-item .ndate{font-size:10.5px;color:var(--muted);margin-top:4px}
.note-item .del{color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.empty svg{width:48px;height:48px;opacity:.4;margin-bottom:10px}

/* 底部导航 */
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));background:var(--bg2);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-b);z-index:100;backdrop-filter:blur(12px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);cursor:pointer;transition:color .2s;font-size:9px}
.nav-item.active{color:var(--primary-d)}
.nav-item svg{width:18px;height:18px}
.nav-item .ni{position:relative}

/* 主题面板 */
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + var(--safe-b));z-index:200;transform:translateY(100%);transition:transform .3s;border-top:1px solid var(--border)}
.sheet.show{transform:none}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet h3{font-size:16px;margin-bottom:14px;text-align:center}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.theme-opt{border:2px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s;background:var(--card)}
.theme-opt.active{border-color:var(--primary)}
.theme-opt .prev{height:40px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(0,0,0,.08)}
.theme-opt span{font-size:11.5px;color:var(--text2)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--border)}
.toggle-row span{font-size:14px}
.switch{width:46px;height:26px;border-radius:14px;background:var(--border);position:relative;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--primary)}
.switch.on::after{transform:translateX(20px)}

/* toast */
.toast{position:fixed;bottom:calc(var(--nav-h) + 30px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:24px;font-size:13px;z-index:300;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) none}

/* 搜索高亮 */
mark{background:var(--accent);color:#fff;border-radius:3px;padding:0 2px}
.hidden{display:none !important}

/* 适配大屏 */
@media(min-width:560px){
  .theme-grid{grid-template-columns:repeat(5,1fr)}
}

/* ============ 城市模块 ============ */
.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.city-chip{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.city-chip:active{transform:scale(.94)}
.city-chip.active{border-color:var(--primary);background:var(--primary-l)}
.city-chip .cname{font-size:14px;font-weight:700;color:var(--text)}
.city-chip .creg{font-size:10px;color:var(--muted);margin-top:2px}
.city-chip .csal{font-size:10px;color:var(--primary-d);margin-top:4px;font-weight:600}
.city-chip .check{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--primary);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center}
.city-chip.checked .check{display:flex}

.city-detail{display:none}
.city-detail.show{display:block;animation:fade .3s}
.city-section{margin-bottom:14px}
.city-section .sh{font-size:12px;font-weight:700;color:var(--primary-d);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.city-section .sv{font-size:13px;color:var(--text2);line-height:1.7}
.city-policy-item{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.city-policy-item .pt{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:4px}
.city-policy-item .pd{font-size:12px;color:var(--text2);margin-bottom:6px}
.city-policy-item .pmeta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.city-policy-item .pdate{background:var(--primary-l);color:var(--primary-d);padding:2px 8px;border-radius:6px;font-weight:600}
.city-site-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--text2);font-size:12px;margin:4px 4px 0 0;transition:all .2s}
.city-site-btn:active{transform:scale(.94)}

.city-compare{margin-bottom:14px}
.cmp-row{display:flex;gap:6px;margin-bottom:6px}
.cmp-col{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px;text-align:center}
.cmp-col b{font-size:13px;color:var(--primary-d);display:block}
.cmp-col span{font-size:10px;color:var(--muted)}
.cmp-header{display:flex;gap:6px;margin-bottom:8px}
.cmp-h{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--primary-d);padding:8px;background:var(--primary-l);border-radius:10px}
.cmp-label{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}

.mode-tabs{display:flex;gap:6px;margin-bottom:14px}
.mode-tab{flex:1;padding:8px;text-align:center;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s}
.mode-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ============ 视频播放器模态框 ============ */
.vid-modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.vid-modal.show{display:flex;animation:fade .3s}
.vid-modal-close{position:absolute;top:12px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:10}
.vid-modal-title{color:#fff;font-size:14px;margin-bottom:10px;text-align:center;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid-frame-wrap{width:100%;max-width:560px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;position:relative}
.vid-frame-wrap iframe{width:100%;height:100%;border:none}
.vid-modal-links{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.vid-modal-links a{color:var(--primary-l);font-size:12px;padding:6px 14px;border:1px solid rgba(255,255,255,.25);border-radius:20px;text-decoration:none}

/* 视频卡片缩略图 */
.vid-thumb-real{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.vid-card{display:flex;gap:10px;margin-bottom:10px;cursor:pointer;transition:transform .2s}
.vid-card:active{transform:scale(.98)}
.vid-thumb-box{width:130px;min-width:130px;height:80px;border-radius:10px;overflow:hidden;position:relative;background:var(--primary-l)}
.vid-thumb-box .play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.vid-thumb-box .play-overlay svg{width:28px;height:28px;color:#fff;opacity:.9}
.vid-duration{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px}

/* ============ 日历+心情 ============ */
.cal-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .cm-title{font-size:15px;font-weight:700;color:var(--text)}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:10px;color:var(--muted);padding:4px 0}
.cal-day{text-align:center;font-size:12px;padding:7px 0;border-radius:8px;cursor:pointer;position:relative;transition:all .15s;min-height:34px}
.cal-day:active{transform:scale(.9)}
.cal-day.other{opacity:.3}

/* ============ 数据加载器 ============ */
// 数据变量（初始为空，加载后赋值）
let TRENDS=[], POLICIES=[], GLOBAL=[], REMOTE_PLATFORMS=[], REMOTE_JOBS=[], CITIES=[], VIDEOS=[];

// 数据文件映射
const DATA_FILES={
  TRENDS:'./data/trends.json',
  POLICIES:'./data/policies.json',
  GLOBAL:'./data/global.json',
  REMOTE_PLATFORMS:'./data/remote-platforms.json',
  REMOTE_JOBS:'./data/remote-jobs.json',
  CITIES:'./data/cities.json',
  VIDEOS:'./data/videos.json'
};

// 加载单个数据文件
async function loadData(key,url){
  try{
    const res=await fetch(url,{cache:'no-cache'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(Array.isArray(data)&&data.length>0){
      window[key]=data;
      return {key,success:true,count:data.length};
    }
    throw new Error('空数据');
  }catch(e){
    console.warn('加载'+key+'失败，使用降级数据:',e.message);
    window[key]=window[key+'_FALLBACK']||[];
    return {key,success:false,count:window[key].length,fallback:true};
  }
}

// 加载最后更新时间
async function loadLastUpdate(){
  try{
    const res=await fetch('./data/last-update.json',{cache:'no-cache'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    return data.time||null;
  }catch(e){
    console.warn('加载更新时间失败:',e.message);
    return null;
  }
}

// 格式化时间
function formatTime(isoStr){
  if(!isoStr)return '';
  try{
    const d=new Date(isoStr);
    const now=new Date();
    const diff=now-d;
    const hours=Math.floor(diff/3600000);
    const days=Math.floor(diff/86400000);
    const fmt=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(hours<1)return lang==='en'?'Updated just now':'刚刚更新';
    if(hours<24)return lang==='en'?`Updated ${hours}h ago`:`${hours}小时前更新`;
    if(days<7)return lang==='en'?`Updated ${days}d ago`:`${days}天前更新`;
    return lang==='en'?`Updated ${fmt}`:fmt+' 更新';
  }catch(e){return ''}
}

// 显示骨架屏
function showSkeleton(){
  const html=`
    <div class="loading-wrap">
      <div class="skel-card skeleton"></div>
      <div class="skel-card skeleton"></div>
      <div class="skel-card skeleton"></div>
      <div class="skel-card skeleton"></div>
      <div class="loading-tip">${lang==='en'?'Loading data...':'数据加载中...'}</div>
    </div>`;
  document.getElementById('content').innerHTML=html;
}

// 并行加载所有数据
async function loadAllData(){
  showSkeleton();
  
  const promises=Object.entries(DATA_FILES).map(([k,v])=>loadData(k,v));
  const results=await Promise.all(promises);
  
  // 加载最后更新时间
  const lastTime=await loadLastUpdate();
  const el=document.getElementById('lastUpdate');
  if(el&&lastTime){
    el.textContent=formatTime(lastTime);
  }else if(el){
    el.textContent=lang==='en'?'Data loaded':'数据已加载';
  }
  
  // 统计
  const success=results.filter(r=>r.success).length;
  const fallback=results.filter(r=>r.fallback).length;
  console.log(`数据加载完成: ${success}个成功, ${fallback}个降级`);
  
  return results;
}

let activePage="home", activeCat="all", searchQ="";

/* ============ 渲染 ============ */
function t(obj){return obj?obj[lang]:obj}
function openLink(url){
  try{window.open(url,'_blank','noopener,noreferrer');return}catch(e){}
  var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function linkHTML(label,url,extraClass){
  return `<a class="link-btn ${extraClass||''}" href="${url}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" onclick="event.preventDefault();openLink('${url.replace(/'/g,"\\'")}')" >${label} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg></a>`;
}
function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild}

/* ============ 已读标记系统 ============ */
function getRead(){return JSON.parse(localStorage.getItem("tw_read")||"[]")}
function isRead(id){return getRead().includes(id)}
function toggleRead(id){
  const r=getRead();
  const i=r.indexOf(id);
  if(i>=0){r.splice(i,1)}else{r.push(id)}
  localStorage.setItem("tw_read",JSON.stringify(r));
}
function getUnreadCount(page){
  const r=getRead();
  let data=[];
  if(page==="trend")data=TRENDS;
  else if(page==="policy")data=POLICIES;
  else if(page==="global")data=GLOBAL;
  else if(page==="remote")data=REMOTE_JOBS;
  return data.filter(d=>!r.includes(d.id||d.title?.cn)).length;
}

function renderNav(){
  document.getElementById("bottomnav").innerHTML=NAV.map(n=>{
    const unread=["trend","policy","global","remote"].includes(n.id)?getUnreadCount(n.id):0;
    return `<div class="nav-item ${n.id===activePage?"active":""}" data-nav="${n.id}" style="position:relative">
      <div class="ni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${n.icon}</svg></div>
      <span>${t(n)}</span>
      ${unread>0?`<div class="nav-badge">${unread>9?'9+':unread}</div>`:""}
    </div>`;
  }).join("");
  document.querySelectorAll("[data-nav]").forEach(e=>e.onclick=()=>{activePage=e.dataset.nav;renderNav();renderContent();window.scrollTo(0,0)});
}

function renderCats(){
  document.getElementById("catBar").innerHTML=CATS.map(c=>`<div class="chip ${c.id===activeCat?"active":""}" data-cat="${c.id}">${t(c)}</div>`).join("");
  document.querySelectorAll("[data-cat]").forEach(e=>e.onclick=()=>{activeCat=e.dataset.cat;renderCats();renderContent()});
}

function tagHTML(tag){
  const map={hot:'<span class="tag hot">🔥 '+t({cn:"热门",en:"Hot"})+'</span>',new:'<span class="tag new">✦ '+t({cn:"风口",en:"Trend"})+'</span>',gov:'<span class="tag gov">🏛 '+t({cn:"政策",en:"Policy"})+'</span>',global:'<span class="tag global">🌍 '+t({cn:"国际",en:"Global"})+'</span>',career:'<span class="tag career">🎯 '+t({cn:"转行",en:"Career"})+'</span>'};
  return map[tag]||"";
}

function hl(text){
  if(!searchQ)return text;
  const q=searchQ.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return text.replace(new RegExp(q,"gi"),m=>`<mark>${m}</mark>`);
}

function cardHTML(item){
  const itemId=item.id||t(item.title);
  const read=isRead(itemId);
  const nums=item.nums?`<div class="nums">${item.nums.map(n=>`<div class="num-pill">${t(n.k)} <b>${hl(t(n.v))}</b></div>`).join("")}</div>`:"";
  const region=item.region?`<span class="num-pill">📍 ${hl(t(item.region))}</span>`:"";
  const links=item.links?`<div class="card-links">${item.links.map(l=>{
    let html=`<a class="link-btn ${l.gov?"":"alt"}" href="${l.u}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" onclick="event.preventDefault();openLink('${l.u.replace(/'/g,"\\'")}')">${l.gov?"🏛 ":""}${t(l.t)} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg></a>`;
    if(l.foreign||item.foreign){const tu=`https://translate.google.com/translate?sl=auto&tl=zh-CN&u=${encodeURIComponent(l.u)}`;html+=`<a class="link-btn alt" href="${tu}" target="_blank" rel="noopener noreferrer" onclick="event.preventDefault();openLink('${tu}')">🌐 ${t(I.translate)}</a>`}
    return html;
  }).join("")}</div>`:"";
  return `<div class="card read-item ${read?'is-read':''}" data-readid="${itemId}">
    ${!read?`<div class="read-badge">${t({cn:"未读",en:"NEW"})}</div>`:""}
    <div class="card-head">${tagHTML(item.tag)}<h3>${hl(t(item.title))}</h3></div>
    ${region}
    <p>${hl(t(item.desc))}</p>
    ${nums}
    ${links}
    <div class="src">🔗 ${t(I.realtime)} · ${new Date().toLocaleDateString(lang==="en"?"en":"zh")} <span class="read-toggle" onclick="markRead('${itemId.replace(/'/g,"\\'")}')">${read?t({cn:"↩ 取消已读",en:"↩ Unread"}):t({cn:"✓ 标记已读",en:"✓ Mark read"})}</span></div>
  </div>`;
}

function markRead(id){
  toggleRead(id);
  renderNav();
  renderContent();
}

function renderHome(){
  const c=document.getElementById("content");
  /* 搜索或筛选时，跨所有数据全局搜索 */

    c.innerHTML=`<div class="sec-title"><span class="bar"></span>${t({cn:"搜索结果",en:"Search Results"})}<span class="en">/ ${searchQ?'"'+searchQ+'"':t(CATS.find(c=>c.id===activeCat))}</span></div>${renderList(all)}`;

    <div class="hero">

        <div class="hero-stat"><b>100万+</b><span>${t(I.stat2)}</span></div>

    ${TRENDS.slice(0,3).map(cardHTML).join("")}
    <div class="card" style="text-align:center;background:linear-gradient(135deg,var(--primary-l),var(--card2));border-color:var(--primary-l)">
      <p style="color:var(--primary-d);font-weight:600;margin-bottom:10px">${t({cn:"想看更多？切换到「风口」「政策」或「远程」页",en:"Want more? Switch to Trends, Policy or Remote"})}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">

      </div>
    </div>`;
}

function goPage(p){activePage=p;renderNav();renderContent();window.scrollTo(0,0)}

function renderList(arr){
  let filtered=arr.filter(i=>activeCat==="all"||i.cat===activeCat);
  if(searchQ)filtered=filtered.filter(i=>(t(i.title)+t(i.desc)+(i.region?t(i.region):"")+(i.nums?i.nums.map(n=>t(n.v)).join(""):"")).toLowerCase().includes(searchQ.toLowerCase()));
  if(!filtered.length)return `<div class="empty">${t({cn:"没有匹配内容",en:"No matches"})}</div>`;
  return filtered.map(cardHTML).join("");
}

      <div class="card-links">${c.links.map(l=>`<a class="link-btn" href="${l.u}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" onclick="event.preventDefault();openLink('${l.u.replace(/'/g,"\\'")}')">${t(l.t)} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg></a>`).join("")}</div>
      <button class="add-btn" style="margin-top:10px;width:100%" onclick="generateActionPlan('recommend',${ci})">${t({cn:"📋 生成具体行动计划",en:"📋 Generate Action Plan"})}</button>

    <div class="card" style="background:linear-gradient(135deg,var(--primary-l),var(--card2))">
      <p style="color:var(--primary-d);font-weight:600">${t({cn:"💡 建议：先用路径三（医养+新媒体）在职过渡，边还贷边学技能，3-6个月技能成熟后再切换到路径一或二。",en:"Tip: Start with Path 3 (med-care+media) while employed, pay loan & learn skills, switch to Path 1/2 in 3-6 months."})}</p>

function renderCareerCustom(){
  let allSteps=[];
  CAREERS.forEach((c,ci)=>{
    c.steps.forEach((s,si)=>{
      allSteps.push({ci,si,color:c.color,title:s.t,desc:s.d,from:c.title});
    });
  });
  const selected=Object.keys(customSteps).filter(k=>customSteps[k]);
  document.getElementById("careerBody").innerHTML=`
    <div class="card" style="background:var(--card2)"><p style="font-size:12.5px;color:var(--text2)">✅ ${t({cn:"从下方步骤中自由勾选，组合属于你自己的转行路径。选好后点击「保存我的路径」。",en:"Check steps below to build your own career path. Tap 'Save My Path' when done."})}</p></div>
    <div class="path-builder">
      ${allSteps.map(s=>{
        const key=`${s.ci}_${s.si}`;
        const sel=customSteps[key];
        return `<div class="pb-step ${sel?'selected':''}" onclick="toggleStep('${key}')">
          <div class="pb-check">${sel?'✓':''}</div>
          <div class="pb-content">
            <div class="pb-title">${t(s.title)}</div>
            <div class="pb-desc">${t(s.desc)}</div>
            <div class="pb-from">📍 ${t(s.from)}</div>
          </div>
        </div>`;
      }).join("")}
      <div class="pb-preview">
        <div class="pb-preview-title">📋 ${t({cn:"我的自定义路径",en:"My Custom Path"})}（${selected.length} ${t({cn:"步",en:"steps"})}）</div>
        ${selected.length?selected.map((k,i)=>{
          const [ci,si]=k.split('_').map(Number);
          const s=CAREERS[ci].steps[si];
          return `<div style="font-size:12px;margin:4px 0;padding:4px 8px;background:var(--card);border-radius:8px"><b style="color:var(--primary-d)">${i+1}.</b> ${t(s.t)} <span style="font-size:10px;color:var(--muted)">— ${t(CAREERS[ci].title)}</span></div>`;
        }).join(""):`<div style="font-size:12px;color:var(--muted)">${t({cn:"还没有选择步骤",en:"No steps selected yet"})}</div>`}
        ${selected.length?`<button class="add-btn" style="margin-top:8px;width:100%" onclick="saveCustomPath()">${t({cn:"💾 保存我的路径",en:"Save My Path"})}</button>
        <button class="add-btn" style="margin-top:6px;width:100%;background:var(--accent);color:#fff" onclick="generateActionPlan('custom')">${t({cn:"📋 生成具体行动计划",en:"📋 Generate Action Plan"})}</button>`:""}
      </div>
    </div>`;
}

function toggleStep(key){
  customSteps[key]=!customSteps[key];
  renderCareerCustom();
}
function saveCustomPath(){
  const selected=Object.keys(customSteps).filter(k=>customSteps[k]);
  if(!selected.length)return;
  const path=selected.map(k=>{
    const [ci,si]=k.split('_').map(Number);
    return{ci,si,title:CAREERS[ci].steps[si].t,from:CAREERS[ci].title};
  });
  let saved=JSON.parse(localStorage.getItem("tw_custompath")||"[]");
  saved.unshift({id:Date.now(),steps:path,date:new Date().toLocaleDateString(lang==="en"?"en":"zh")});
  localStorage.setItem("tw_custompath",JSON.stringify(saved));
  toast(t({cn:"路径已保存！",en:"Path saved!"}));
}

function generateActionPlan(source,ci){
  let steps=[];
  let planTitle="";
  if(source==="recommend"){
    const c=CAREERS[ci];
    planTitle=t(c.title);
    steps=c.steps.map((s,i)=>({title:s.t,desc:s.d,from:c.title}));
  }else{
    const selected=Object.keys(customSteps).filter(k=>customSteps[k]).sort();
    if(!selected.length){toast(t({cn:"请先选择步骤",en:"Select steps first"}));return}
    planTitle=t({cn:"我的自定义路径",en:"My Custom Path"});
    steps=selected.map(k=>{
      const [ci2,si]=k.split('_').map(Number);
      return{title:CAREERS[ci2].steps[si].t,desc:CAREERS[ci2].steps[si].d,from:CAREERS[ci2].title};
    });
  }
  const weekPlans=[
    {week:t({cn:"第1-2周：打基础",en:"Wk 1-2: Foundation"}),tasks:[]},
    {week:t({cn:"第3-4周：上手实操",en:"Wk 3-4: Hands-on"}),tasks:[]},
    {week:t({cn:"第5-8周：积累作品",en:"Wk 5-8: Build Portfolio"}),tasks:[]},
    {week:t({cn:"第9-12周：变现/求职",en:"Wk 9-12: Monetize/Job"}),tasks:[]},
  ];
  const actionMap={
    "入门":0,"掌握":0,"学":0,"了解":0,"考证":0,
    "进阶":1,"实操":1,"练习":1,"搭":1,"开始":1,
    "积累":2,"做":2,"产出":2,"运营":2,"发布":2,
    "变现":3,"求职":3,"投":3,"切换":3,"就业":3,"还贷":3,
  };
  steps.forEach(s=>{
    const titleStr=t(s.title);
    let weekIdx=1;
    for(const[key,idx]of Object.entries(actionMap)){if(titleStr.includes(key)){weekIdx=idx;break}}
    weekPlans[weekIdx].tasks.push({title:s.title,desc:s.desc,from:s.from});
  });
  const extraActions=[
    {week:0,task:t({cn:"每天花1小时看B站/抖音教程，建立知识框架",en:"1hr/day watching tutorials, build knowledge framework"})},
    {week:0,task:t({cn:"注册即梦/可灵/剪映账号，熟悉基础界面",en:"Register Jimeng/Kling/CapCut, learn basic UI"})},
    {week:1,task:t({cn:"模仿3个爆款作品，完成第一个练习作品",en:"Copy 3 viral works, finish first practice piece"})},
    {week:1,task:t({cn:"加入2-3个相关交流群，拓展人脉",en:"Join 2-3 community groups, expand network"})},
    {week:2,task:t({cn:"每周产出2-3个作品，发布到抖音/小红书",en:"Produce 2-3 works/week, post to Douyin/XHS"})},
    {week:2,task:t({cn:"记录数据（播放/点赞/转化），分析优化",en:"Track metrics (views/likes/conversion), analyze & optimize"})},
    {week:3,task:t({cn:"在云工网/电鸭注册，接第一个远程订单",en:"Register on Yungong/Eleduck, take first remote order"})},
    {week:3,task:t({cn:"整理作品集，更新简历和各平台主页",en:"Organize portfolio, update resume & profiles"})},
  ];
  extraActions.forEach(a=>weekPlans[a.week].tasks.push({title:{cn:a.task,en:a.task},desc:{cn:"",en:""},from:{cn:"系统建议",en:"System"}}));
  let html=`<div class="action-plan" id="actionPlanDiv">
    <div class="ap-title">📋 ${t({cn:"行动计划",en:"Action Plan"})}：${planTitle}</div>`;
  weekPlans.forEach(wp=>{
    if(!wp.tasks.length)return;
    html+=`<div class="ap-week"><div class="ap-week-title">${wp.week}</div>`;
    wp.tasks.forEach(task=>{
      html+=`<div class="ap-task"><b>${t(task.title)}</b>${task.desc&&t(task.desc)?`<br>${t(task.desc)}`:""}<br><span style="font-size:10px;color:var(--muted)">📍 ${t(task.from)}</span></div>`;
    });
    html+=`</div>`;
  });
  html+=`<div style="margin-top:10px;padding:10px;background:var(--card);border-radius:10px">
    <div style="font-size:12px;font-weight:700;color:var(--primary-d);margin-bottom:6px">💡 ${t({cn:"还贷计划",en:"Loan Plan"})}</div>
    <div style="font-size:12px;color:var(--text2)">${t({cn:"12000元贷款，建议每月还1500-2000元，6-8个月还清。在职期间用工资还贷，副业收入用于学习和积累。",en:"12k loan: pay 1500-2000/mo, clear in 6-8 months. Use salary for loan, side income for learning."})}</div>
  </div>
  <button class="add-btn" style="margin-top:10px;width:100%" onclick="saveActionPlan()">${t({cn:"💾 保存行动计划",en:"Save Action Plan"})}</button>
  </div>`;
  const existing=document.getElementById("actionPlanDiv");
  if(existing)existing.remove();
  const body=source==="recommend"?document.getElementById("careerBody"):document.getElementById("careerBody");
  body.insertAdjacentHTML("beforeend",html);
  setTimeout(()=>{document.getElementById("actionPlanDiv").scrollIntoView({behavior:"smooth",block:"start"})},100);
}
function saveActionPlan(){
  const plan=document.getElementById("actionPlanDiv");
  if(!plan)return;
  localStorage.setItem("tw_actionplan",plan.innerHTML);
  toast(t({cn:"行动计划已保存！可在记录页查看",en:"Action plan saved!"}));
}

let vidFilter="all";

function playVideo(idx){
  const v=VIDEOS[idx];
  if(v.plat!=="bilibili"){if(v.url)openLink(v.url);return}
  const modal=document.getElementById("vidModal");
  document.getElementById("vidModalTitle").textContent=t(v.title);
  const embedUrl=`https://player.bilibili.com/player.html?bvid=${v.bvid}&high_quality=1&autoplay=1&danmaku=0`;
  const origUrl=`https://www.bilibili.com/video/${v.bvid}/`;
  document.getElementById("vidFrameWrap").innerHTML=`<iframe src="${embedUrl}" allow="autoplay;fullscreen;encrypted-media" allowfullscreen scrolling="no"></iframe>`;
  document.getElementById("vidModalLinks").innerHTML=`<a href="${origUrl}" target="_blank" rel="noopener noreferrer" onclick="event.preventDefault();openLink('${origUrl}')">🔗 ${t({cn:"原站观看",en:"Original"})}</a>`;
  modal.classList.add("show");
  document.body.style.overflow="hidden";
}
function closeVidModal(){
  document.getElementById("vidModal").classList.remove("show");
  document.getElementById("vidFrameWrap").innerHTML="";
  document.body.style.overflow="";
}

/* 记录 */
function getNotes(){return JSON.parse(localStorage.getItem("tw_notes")||"[]")}
function saveNotes(n){localStorage.setItem("tw_notes",JSON.stringify(n))}
function getMoods(){return JSON.parse(localStorage.getItem("tw_moods")||"{}")}
function saveMoods(m){localStorage.setItem("tw_moods",JSON.stringify(m))}

const MOODS=[{e:"😊",cn:"开心",en:"Happy"},{e:"💪",cn:"有动力",en:"Motivated"},{e:"😐",cn:"一般",en:"Neutral"},{e:"😴",cn:"疲惫",en:"Tired"},{e:"😰",cn:"焦虑",en:"Anxious"},{e:"🔥",cn:"兴奋",en:"Excited"}];

let calDate=new Date(), calSelected=new Date().toISOString().slice(0,10);

function renderNote(){
  const notes=getNotes();
  const moods=getMoods();
  const cats=[I.noteCat0,I.noteCat1,I.noteCat2,I.noteCat3,I.noteCat4];
  const colors=["#C9A96E","#5B8CC8","#8FA876","#B57B8E","#5BA88A"];
  const todayStr=new Date().toISOString().slice(0,10);
  const selMood=moods[calSelected];
  
  document.getElementById("content").innerHTML=`
    <div class="sec-title"><span class="bar"></span>${t({cn:"心情日历",en:"Mood Calendar"})}<span class="en">/ ${t({cn:"打卡记录",en:"Check-in"})}</span></div>
    <div class="cal-wrap" id="calWrap">${renderCalendar()}</div>
    <div class="card" id="moodCard">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text)">📅 ${calSelected} ${t({cn:"今日心情",en:"Today's Mood"})}</div>
      <div class="mood-picker">
        ${MOODS.map((m,i)=>`<div class="mood-btn ${selMood===i?'selected':''}" onclick="setMood(${i})">${m.e}</div>`).join("")}
      </div>
      <div class="mood-label">${selMood!==undefined?MOODS[selMood].e+' '+t({cn:MOODS[selMood].cn,en:MOODS[selMood].en}):t({cn:"点击表情记录心情",en:"Tap emoji to record mood"})}</div>
    </div>
    <div class="sec-title" style="margin-top:14px"><span class="bar"></span>${t({cn:"我的记录本",en:"My Notebook"})}<span class="en">/ 💾 ${t({cn:"本地保存",en:"Local"})}</span></div>
    <div class="note-input">
      <select id="noteCat">${cats.map((c,i)=>`<option value="${i}">${t(c)}</option>`).join("")}</select>
      <input id="noteInput" placeholder="${t(I.notePh)}" onkeydown="if(event.key==='Enter')addNote()">
      <button class="add-btn" onclick="addNote()">${t(I.addNote)}</button>
    </div>
    <div id="noteList">${renderNoteList(notes,cats,colors)}</div>`;
  bindCalendar();
}

function renderNoteList(notes,cats,colors){
  if(!notes.length)return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h12l4 4v12H4z"/><path d="M16 4v4h4M8 13h8M8 17h5"/></svg><br>${t(I.noNote)}</div>`;
  return notes.map(n=>`<div class="note-item">
    <div class="nt" style="background:${colors[n.cat]||colors[0]}"></div>
    <div class="nb"><div class="nh"><span class="ncat">${t(cats[n.cat]||cats[0])}</span><span class="del" onclick="delNote(${n.id})">×</span></div>
    <div class="ntext">${n.text.replace(/</g,"&lt;")}</div><div class="ndate">${n.date}</div></div>
  </div>`).join("");
}

function renderCalendar(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const moods=getMoods();
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const dow=lang==="en"?["S","M","T","W","T","F","S"]:["日","一","二","三","四","五","六"];
  const monthNames=lang==="en"?["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]:["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const todayStr=new Date().toISOString().slice(0,10);
  let html=`<div class="cal-head">
    <div class="cm-title">${y} ${monthNames[m]}</div>
    <div class="cal-nav">
      <button onclick="calPrev()">‹</button>
      <button onclick="calToday()">·</button>
      <button onclick="calNext()">›</button>
    </div>
  </div><div class="cal-grid">`;
  dow.forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<first;i++)html+=`<div class="cal-day other"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const mood=moods[ds];
    const cls=[`cal-day`];
    if(ds===todayStr)cls.push("today");
    if(ds===calSelected)cls.push("selected");
    html+=`<div class="${cls.join(' ')}" data-calday="${ds}">${d}${mood!==undefined?`<div class="mood-dot">${MOODS[mood].e}</div>`:""}</div>`;
  }
  html+=`</div>`;
  return html;
}

function bindCalendar(){
  document.querySelectorAll("[data-calday]").forEach(e=>{
    e.onclick=()=>{
      calSelected=e.dataset.calday;
      renderNote();
    };
  });
}
function calPrev(){calDate.setMonth(calDate.getMonth()-1);renderNote()}
function calNext(){calDate.setMonth(calDate.getMonth()+1);renderNote()}
function calToday(){calDate=new Date();calSelected=new Date().toISOString().slice(0,10);renderNote()}

function setMood(idx){
  const moods=getMoods();
  if(moods[calSelected]===idx){delete moods[calSelected]}
  else{moods[calSelected]=idx}
  saveMoods(moods);
  toast(t({cn:"已记录心情",en:"Mood saved"}));
  renderNote();
}

function addNote(){
  const inp=document.getElementById("noteInput"),sel=document.getElementById("noteCat");
  if(!inp.value.trim())return;
  const notes=getNotes();
  notes.unshift({id:Date.now(),cat:sel.value,text:inp.value.trim(),date:calSelected+" "+new Date().toLocaleTimeString(lang==="en"?"en":"zh",{hour:"2-digit",minute:"2-digit"})});
  saveNotes(notes);inp.value="";toast(t(I.saved));renderNote();
}
function delNote(id){saveNotes(getNotes().filter(n=>n.id!==id));toast(t(I.deleted));renderNote()}

function applyTheme(){
  document.documentElement.setAttribute("data-theme",theme);
  document.querySelector('meta[name="theme-color"]').setAttribute("content",getComputedStyle(document.documentElement).getPropertyValue("--primary-d").trim());
  localStorage.setItem("tw_theme",theme);
}
function applyEye(){
  document.body.classList.toggle("eye-on",eye);
  document.getElementById("eyeBtn").classList.toggle("active",eye);
  localStorage.setItem("tw_eye",eye?"1":"0");
}
function applyLang(){
  document.documentElement.lang=lang==="en"?"en":"zh-CN";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(I[e.dataset.i]));
  document.getElementById("langTxt").textContent=lang==="cn"?"EN":"中";
  document.getElementById("search").placeholder=lang==="cn"?I.searchPh.cn:I.searchPh.en;
  document.getElementById("langSwitch").classList.toggle("on",lang==="en");
  renderNav();renderCats();renderContent();
}
function toggleLang(){lang=lang==="cn"?"en":"cn";localStorage.setItem("tw_lang",lang);applyLang();toast(lang==="en"?"EN":"中文")}
function toggleEye(){eye=!eye;applyEye();toast(eye?t(I.eyeOn):t(I.eyeOff))}

function renderThemeSheet(){
  document.getElementById("themeGrid").innerHTML=THEMES.map(th=>`<div class="theme-opt ${th.id===theme?"active":""}" data-th="${th.id}">
    <div class="prev" style="background:linear-gradient(135deg,${th.c1},${th.c2})"></div>
    <span>${lang==="en"?th.en:th.cn}</span>
  </div>`).join("");
  document.querySelectorAll("[data-th]").forEach(e=>e.onclick=()=>{theme=e.dataset.th;applyTheme();renderThemeSheet()});
}

/* ============ 工具 ============ */
let toastT;
function toast(msg){const e=document.getElementById("toast");e.textContent=msg;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),1800)}

/* ============ 事件 ============ */
document.getElementById("search").addEventListener("input",e=>{searchQ=e.target.value.trim();renderContent()});
document.getElementById("langBtn").onclick=toggleLang;
document.getElementById("eyeBtn").onclick=toggleEye;
document.getElementById("themeBtn").onclick=()=>{renderThemeSheet();document.getElementById("themeSheet").classList.add("show");document.getElementById("sheetMask").classList.add("show")};
document.getElementById("eyeSwitch").onclick=toggleEye;
document.getElementById("langSwitch").onclick=toggleLang;
document.getElementById("sheetMask").onclick=()=>{document.getElementById("themeSheet").classList.remove("show");document.getElementById("sheetMask").classList.remove("show")};

/* ============ 初始化 ============ */
applyTheme();applyEye();
// 加载数据后再渲染
loadAllData().then(()=>{
  applyLang();
});

// ============ PWA Service Worker ============
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(()=>console.log('SW OK')).catch(()=>{});
}
// PWA安装提示
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  const btn=document.getElementById('pwaInstallBtn');
  if(btn){btn.style.display='flex';btn.onclick=()=>{deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;btn.style.display='none'})}}
});
</script>
</body>
</html>
